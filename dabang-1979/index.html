<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Dabang 1979 - a Korean tearoom you can send a request to</title>
<meta name="description" content="A Korean tearoom in 1979, late afternoon. Write a request slip, put it in the DJ box, and the room re-mixes around what you asked for. The room is synthesised in the browser; only the music is a generated file.">
<meta name="theme-color" content="#25150c">
<meta property="og:title" content="Dabang 1979">
<meta property="og:description" content="Write a request slip, put it in the DJ box, and a 1979 tearoom re-mixes around it. The room is synthesised in the browser; only the music is a generated file.">
<meta property="og:type" content="website">
<meta property="og:url" content="https://sylvanus4.github.io/dabang-1979/">
<link rel="canonical" href="https://sylvanus4.github.io/dabang-1979/">
<link rel="stylesheet" href="assets/css/style.css">
</head>
<body>

<header class="rail">
  <button type="button" id="lang" class="rail-btn" aria-label="Switch to Korean">한국어</button>
  <button type="button" id="mute" class="rail-btn" aria-pressed="false" aria-label="Mute">
    <span class="ico" aria-hidden="true"></span>
  </button>
  <div class="vol" id="vol" role="slider" tabindex="0"
       aria-label="Volume" aria-valuemin="0" aria-valuemax="100" aria-valuenow="72"
       aria-valuetext="Volume 72 percent">
    <span class="vol-fill" id="volFill"></span>
  </div>
</header>

<main>

  <!-- The room is behind everything, including the door screen. -->
  <svg class="scene" id="scene" viewBox="0 0 1200 750" preserveAspectRatio="xMidYMid slice"
       aria-hidden="true" focusable="false" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <linearGradient id="gWall" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#4a2c17"/><stop offset="0.55" stop-color="#331d10"/>
        <stop offset="1" stop-color="#20120a"/>
      </linearGradient>
      <linearGradient id="gLight" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0" stop-color="#ffcf7d" stop-opacity="0.5"/>
        <stop offset="1" stop-color="#ffb347" stop-opacity="0"/>
      </linearGradient>
      <linearGradient id="gVinyl" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#8d1f21"/><stop offset="1" stop-color="#4a0f13"/>
      </linearGradient>
      <linearGradient id="gWood" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#6b4222"/><stop offset="1" stop-color="#38200f"/>
      </linearGradient>
      <linearGradient id="gBrass" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0" stop-color="#e6b45c"/><stop offset="0.5" stop-color="#a5762c"/>
        <stop offset="1" stop-color="#6d4a17"/>
      </linearGradient>
      <radialGradient id="gGlow" cx="0.5" cy="0.5" r="0.5">
        <stop offset="0" stop-color="#ffd08a" stop-opacity="0.55"/>
        <stop offset="1" stop-color="#ffd08a" stop-opacity="0"/>
      </radialGradient>
      <radialGradient id="gEye" cx="0.5" cy="0.5" r="0.5">
        <stop offset="0" stop-color="#c9ffd6" stop-opacity="0.95"/>
        <stop offset="0.55" stop-color="#4fe08a" stop-opacity="0.8"/>
        <stop offset="1" stop-color="#0d3a22" stop-opacity="0.9"/>
      </radialGradient>
      <radialGradient id="gVig" cx="0.52" cy="0.44" r="0.66">
        <stop offset="0.26" stop-color="#000" stop-opacity="0"/>
        <stop offset="0.7" stop-color="#0a0503" stop-opacity="0.45"/>
        <stop offset="1" stop-color="#070301" stop-opacity="0.96"/>
      </radialGradient>
      <filter id="fHaze" x="-30%" y="-30%" width="160%" height="160%">
        <feTurbulence type="fractalNoise" baseFrequency="0.008 0.016" numOctaves="3" seed="7"/>
        <feDisplacementMap in="SourceGraphic" scale="44"/>
        <feGaussianBlur stdDeviation="15"/>
      </filter>
      <filter id="fGrain">
        <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="2" seed="3"/>
        <feColorMatrix type="saturate" values="0"/>
      </filter>
      <clipPath id="cGlass"><rect x="580" y="188" width="300" height="242" rx="6"/></clipPath>
    </defs>

    <!-- wall, ceiling, floor -->
    <rect x="-200" y="-420" width="1600" height="1500" fill="url(#gWall)"/>
    <g opacity="0.16" stroke="#f0c98a" stroke-width="1.4">
      <path d="M-200 60H1400M-200 180H1400M-200 300H1400M-200 420H1400"/>
      <path d="M60 -420V560M220 -420V560M380 -420V560M820 -420V560M980 -420V560M1140 -420V560"/>
    </g>
    <path d="M-200 560H1400V1080H-200Z" fill="#2b1a0e"/>
    <g opacity="0.2" stroke="#c9a06a" stroke-width="1.2">
      <path d="M-200 640H1400M-200 730H1400M-200 840H1400M-200 970H1400"/>
    </g>

    <!-- ceiling lamp, only framed in on tall viewports -->
    <g>
      <path d="M638 -420V-250" stroke="#6b4a20" stroke-width="5"/>
      <path d="M558 -250h160l-34 92h-92Z" fill="url(#gBrass)"/>
      <ellipse cx="638" cy="-158" rx="46" ry="12" fill="#ffca7a" opacity="0.85"/>
      <ellipse cx="638" cy="-92" rx="250" ry="170" fill="url(#gGlow)"/>
    </g>

    <!-- window, low sun -->
    <g>
      <rect x="34" y="66" width="272" height="336" rx="4" fill="#0f0a06"/>
      <rect x="44" y="76" width="252" height="316" fill="#ffbe63" opacity="0.62"/>
      <path d="M170 66V402M34 234H306" stroke="#2a1809" stroke-width="12"/>
      <rect x="26" y="58" width="288" height="352" rx="6" fill="none" stroke="url(#gBrass)" stroke-width="7"/>
    </g>
    <!-- shafts of late light, cutting right across the room -->
    <g opacity="0.44" class="shafts">
      <path d="M44 96 L1220 452 L1220 566 L44 296Z" fill="url(#gLight)"/>
      <path d="M44 244 L1220 588 L1220 646 L44 372Z" fill="url(#gLight)" opacity="0.66"/>
    </g>
    <!-- where that light lands on the floor -->
    <ellipse cx="880" cy="646" rx="430" ry="94" fill="url(#gGlow)" opacity="0.55"/>

    <!-- banquette: deep red vinyl, brass studs -->
    <g>
      <path d="M932 396h300v320H932Z" fill="url(#gVinyl)"/>
      <path d="M932 396h300v40H932Z" fill="#a72a2a" opacity="0.5"/>
      <path d="M912 596h320v26H912Z" fill="#5c1216"/>
      <path d="M912 622h320v96H912Z" fill="#6d171b"/>
      <g opacity="0.6" stroke="#5c1216" stroke-width="3">
        <path d="M992 396v200M1052 396v200M1112 396v200M1172 396v200"/>
      </g>
      <g fill="url(#gBrass)">
        <circle cx="992" cy="470" r="5"/><circle cx="1052" cy="470" r="5"/>
        <circle cx="1112" cy="470" r="5"/><circle cx="1172" cy="470" r="5"/>
      </g>
      <path d="M912 718h320v18H912Z" fill="#150c07" opacity="0.75"/>
    </g>

    <!-- the DJ box: a glass booth at the back, lit from inside.
         Shifted left so it lands in the empty middle column of the layout. -->
    <g transform="translate(-92,0)">
      <ellipse cx="730" cy="470" rx="230" ry="46" fill="#0d0704" opacity="0.7"/>
      <rect x="560" y="168" width="340" height="292" rx="10" fill="#170d07"/>
      <rect x="560" y="168" width="340" height="292" rx="10" fill="none" stroke="url(#gBrass)" stroke-width="8"/>
      <g clip-path="url(#cGlass)">
        <rect x="580" y="188" width="300" height="242" fill="#0f0805"/>
        <ellipse cx="700" cy="240" rx="190" ry="120" fill="#ffb45e" opacity="0.13"/>
        <!-- record wall -->
        <rect x="590" y="198" width="88" height="104" fill="#37200f"/>
        <g stroke="#c68f45" stroke-width="2" opacity="0.42">
          <path d="M598 198v104M608 198v104M618 198v104M628 198v104M638 198v104M648 198v104M658 198v104M668 198v104"/>
        </g>
        <!-- the person in the booth, leaning toward the microphone -->
        <path d="M642 430c0-52 22-86 48-86s48 34 48 86Z" fill="#0a0503"/>
        <path d="M680 300h20v26h-20Z" fill="#0a0503"/>
        <ellipse cx="688" cy="272" rx="25" ry="28" fill="#0a0503"/>
        <path d="M706 252a25 28 0 0 1 4 30" stroke="#c98a3e" stroke-width="2.5"
              fill="none" opacity="0.55"/>
        <path d="M730 356a48 48 0 0 1 6 -34" stroke="#c98a3e" stroke-width="2.5"
              fill="none" opacity="0.35"/>
        <!-- microphone on a short boom off the counter -->
        <path d="M744 402v-88h-44" stroke="#6b5330" stroke-width="4" fill="none"/>
        <rect x="692" y="302" width="15" height="25" rx="7" fill="#2b1e10" stroke="#8a6b3c" stroke-width="2"/>
        <!-- the counter the whole booth is built around -->
        <path d="M580 400h300v34H580Z" fill="#3a2312"/>
        <path d="M580 400h300v7H580Z" fill="#7c5227" opacity="0.8"/>
        <!-- turntable -->
        <circle cx="800" cy="352" r="52" fill="#080503"/>
        <circle cx="800" cy="352" r="52" fill="none" stroke="#4a3520" stroke-width="2"/>
        <g class="disc" style="transform-origin:800px 352px">
          <path d="M800 306a46 46 0 0 1 38 20" stroke="#6b4f2c" stroke-width="2.5" fill="none"/>
          <path d="M800 398a46 46 0 0 1 -38 -20" stroke="#4b361d" stroke-width="2" fill="none"/>
        </g>
        <circle cx="800" cy="352" r="17" fill="#b8541f"/>
        <circle cx="800" cy="352" r="3" fill="#f3d9a8"/>
        <path d="M858 290l-42 58" stroke="#cdae74" stroke-width="4" stroke-linecap="round"/>
        <circle cx="860" cy="288" r="7" fill="url(#gBrass)"/>
        <!-- magic-eye tube: the only cold colour in the room -->
        <g id="eyeWrap">
          <ellipse cx="838" cy="222" rx="42" ry="42" fill="#2ce08a" opacity="0.13"/>
          <circle cx="838" cy="222" r="19" fill="#07130c"/>
          <circle cx="838" cy="222" r="16" fill="url(#gEye)"/>
          <g id="eyeShadow" style="transform-origin:838px 222px">
            <path d="M838 222 L826 207 A19 19 0 0 1 850 207 Z" fill="#04160c" opacity="0.94"/>
          </g>
          <circle cx="838" cy="222" r="19" fill="none" stroke="url(#gBrass)" stroke-width="3"/>
        </g>
      </g>
      <!-- glass reflection: two hard diagonals, the way old plate glass reads -->
      <path d="M580 188 L706 188 L588 430 L580 430Z" fill="#ffe2b0" opacity="0.09"/>
      <path d="M746 188 L790 188 L672 430 L628 430Z" fill="#ffe2b0" opacity="0.06"/>
      <!-- the slot -->
      <rect x="654" y="470" width="152" height="16" rx="8" fill="#080402" stroke="url(#gBrass)" stroke-width="4"/>
      <path d="M660 500h140l-8 16h-124Z" fill="#0d0704" opacity="0.6"/>
    </g>

    <!-- foreground table, seen from the seat -->
    <g>
      <path d="M420 628h570l72 320H348Z" fill="#170d06" opacity="0.6" transform="translate(0,14)"/>
      <path d="M420 628h570l72 320H348Z" fill="url(#gWood)"/>
      <path d="M420 628h570l10 44H410Z" fill="#8a5a2e" opacity="0.55"/>
      <!-- saucer, cup, spoon -->
      <ellipse cx="562" cy="726" rx="64" ry="21" fill="#0e0804" opacity="0.5"/>
      <ellipse cx="560" cy="712" rx="62" ry="20" fill="#d9cbab"/>
      <ellipse cx="560" cy="706" rx="62" ry="20" fill="#f5ecd8"/>
      <ellipse cx="560" cy="702" rx="34" ry="12" fill="#dccdaa"/>
      <path d="M532 698c0-16 56-16 56 0l-6 32c-1 10-43 10-44 0Z" fill="#fbf4e4"/>
      <path d="M588 704c18-4 22 22 4 26" stroke="#e0d2b2" stroke-width="5" fill="none"/>
      <path d="M610 724l44-14" stroke="#cbb98e" stroke-width="5" stroke-linecap="round"/>
      <!-- matchbox and change -->
      <path d="M700 730h74v26h-74Z" fill="#a83c1a"/>
      <path d="M700 730h74v8h-74Z" fill="#d76a35"/>
      <path d="M700 756h74v6h-74Z" fill="#120a05" opacity="0.6"/>
      <g fill="url(#gBrass)">
        <ellipse cx="828" cy="752" rx="15" ry="6"/><ellipse cx="856" cy="740" rx="13" ry="5"/>
        <ellipse cx="842" cy="768" rx="12" ry="5"/>
      </g>
      <!-- a slip somebody already filled in -->
      <path d="M418 756l104-16 12 54-104 16Z" fill="#e5d4ab" opacity="0.9"/>
      <g stroke="#8d7550" stroke-width="2" opacity="0.7">
        <path d="M432 760l76-12M436 776l68-11M440 792l52-8"/>
      </g>
    </g>

    <!-- smoke: wisps at head height, not a wash over the whole room -->
    <g class="haze" opacity="0.13" filter="url(#fHaze)">
      <ellipse cx="470" cy="270" rx="260" ry="52" fill="#ffd9a3"/>
      <ellipse cx="880" cy="180" rx="220" ry="44" fill="#ffcf90"/>
      <ellipse cx="660" cy="360" rx="180" ry="34" fill="#ffe0b4"/>
    </g>
    <rect x="-200" y="-420" width="1600" height="1500" filter="url(#fGrain)" opacity="0.09"
          style="mix-blend-mode:overlay"/>
    <rect x="-200" y="-420" width="1600" height="1500" fill="url(#gVig)"/>
  </svg>

  <!-- ── the door ─────────────────────────────────────────────────── -->
  <section id="cover" class="cover">
    <p class="cover-year" id="cYear">1979</p>
    <h1 class="cover-title" id="cTitle">Dabang</h1>
    <p class="cover-hero" id="cHero"></p>
    <button type="button" id="begin" class="begin"><span id="cBegin"></span></button>
    <p class="cover-note" id="cNote"></p>
    <p class="cover-warn" id="cWarn" hidden></p>
  </section>

  <!-- ── the room ─────────────────────────────────────────────────── -->
  <div id="room" class="room" hidden>


    <div class="stage">

      <!-- the request slip -->
      <form id="slipForm" class="slip" novalidate>
        <div class="slip-top" aria-hidden="true"></div>
        <div class="slip-head">
          <h2 class="slip-h" id="sHead">REQUEST</h2>
          <p class="slip-sub" id="sSub"></p>
        </div>
        <p class="slip-hint" id="sHint"></p>

        <div class="row">
          <p class="q" id="qMood">Play me</p>
          <div class="chips" role="radiogroup" aria-labelledby="qMood" data-group="mood">
            <button type="button" class="chip" role="radio" data-value="slow" aria-checked="false" tabindex="-1"></button>
            <button type="button" class="chip" role="radio" data-value="brass" aria-checked="true" tabindex="0"></button>
            <button type="button" class="chip" role="radio" data-value="dance" aria-checked="false" tabindex="-1"></button>
            <button type="button" class="chip" role="radio" data-value="quiet" aria-checked="false" tabindex="-1"></button>
          </div>
        </div>

        <div class="row">
          <p class="q" id="qNote">Because</p>
          <div class="chips" role="radiogroup" aria-labelledby="qNote" data-group="note">
            <button type="button" class="chip" role="radio" data-value="goodbye" aria-checked="false" tabindex="-1"></button>
            <button type="button" class="chip" role="radio" data-value="birthday" aria-checked="false" tabindex="-1"></button>
            <button type="button" class="chip" role="radio" data-value="weather" aria-checked="false" tabindex="-1"></button>
            <button type="button" class="chip" role="radio" data-value="nothing" aria-checked="true" tabindex="0"></button>
          </div>
        </div>

        <div class="row">
          <p class="q" id="qWho">For</p>
          <div class="chips" role="radiogroup" aria-labelledby="qWho" data-group="who">
            <button type="button" class="chip" role="radio" data-value="across" aria-checked="true" tabindex="0"></button>
            <button type="button" class="chip" role="radio" data-value="everyone" aria-checked="false" tabindex="-1"></button>
            <button type="button" class="chip" role="radio" data-value="myself" aria-checked="false" tabindex="-1"></button>
            <button type="button" class="chip" role="radio" data-value="absent" aria-checked="false" tabindex="-1"></button>
          </div>
        </div>

        <button type="submit" id="send" class="send"></button>
        <div class="slip-bottom" aria-hidden="true"></div>
      </form>

      <!-- what the booth is doing right now -->
      <p class="booth-line" id="boothLine" role="status" aria-live="polite"></p>

      <!-- what is on the turntable, and what else is in the air -->
      <aside class="readouts">
      <section id="now" class="now" hidden>
        <h2 class="now-h" id="nHead">On the turntable</h2>
        <p class="now-for" id="nFor"></p>
        <p class="now-tempo" id="nTempo"></p>
        <ul class="meters" id="nMeters"></ul>
        <button type="button" id="again" class="again"></button>
      </section>

      <section class="legend" id="legend">
        <h2 class="legend-h" id="lHead">What is in the air</h2>
        <p id="lRoom"></p>
        <p id="lRecord"></p>
        <p id="lBooth"></p>
      </section>
      </aside>

    </div>
  </div>
</main>

<footer class="foot">
  <span id="fNote"></span>
  <a href="https://sylvanus4.github.io" id="fCredit">More pieces</a>
</footer>

<script type="module" src="assets/js/app.js"></script>
</body>
</html>
